<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English & Faith</title>
  <style>
    :root {
      --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; --card-bg: #ffffff;
      --text: #333333; --whatsapp-green: #25D366; --spotify-green: #1DB954;
      --audio-purple: #8e44ad; --anki-hard: #e74c3c; --anki-good: #f39c12; --anki-easy: #2ecc71;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
    
    #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--primary); z-index: 1000; display: flex; align-items: center; justify-content: center; color: white; padding: 20px; }
    .pin-card { background: rgba(255, 255, 255, 0.1); padding: 2rem; border-radius: 12px; text-align: center; max-width: 320px; width: 100%; backdrop-filter: blur(10px); }
    .pin-input { width: 80%; padding: 12px; font-size: 1.5rem; text-align: center; border: none; border-radius: 8px; margin: 1rem 0; outline: none; }
    .btn-unlock { width: 85%; padding: 12px; background-color: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    header { background-color: var(--primary); color: white; padding: 1rem; text-align: center; position: relative; }
    nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #e0e0e0; position: sticky; top: 0; z-index: 10; }
    .tab-btn { padding: 10px 2px; border: none; background: #ffffff; font-size: 0.7rem; font-weight: 600; color: #666; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: var(--accent); background: #f0f8ff; border-bottom-color: var(--accent); }
    .tab-btn.anki-tab { background: #fff8e7; color: #d35400; }
    .tab-btn.anki-tab.active { background: #ffeaa7; border-bottom-color: #d35400; }
    
    main { flex: 1; padding: 1.2rem; max-width: 600px; margin: 0 auto; width: 100%; box-sizing: border-box; }
    .tab-content { display: none; background: var(--card-bg); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .tab-content.active { display: block; }
    .meta-title { font-size: 0.8rem; text-transform: uppercase; color: var(--accent); font-weight: bold; margin-bottom: 0.5rem; }
    .english-text { font-size: 1.2rem; font-weight: 600; color: var(--primary); margin-bottom: 1rem; }
    .translation { font-size: 0.95rem; color: #555; margin-bottom: 1rem; padding-left: 10px; border-left: 3px solid #e0e0e0; }
    .tip-box { background-color: #eef7fc; border-radius: 8px; padding: 10px; font-size: 0.85rem; margin-bottom: 1rem; }
    
    .btn-action { width: 100%; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-audio { background-color: var(--audio-purple); }
    .btn-wpp { background-color: var(--whatsapp-green); }
    .btn-spotify { background-color: var(--spotify-green); }
    
    .word-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
    .btn-add-word { background-color: #e67e22; border: none; border-radius: 6px; padding: 8px; cursor: pointer; }
    
    .flashcard { background: #fdfdfd; border: 2px solid #e2e8f0; border-radius: 12px; padding: 2rem 1rem; text-align: center; margin-bottom: 1.5rem; }
  </style>
</head>
<body>

  <div id="lock-screen">
    <div class="pin-card">
      <h2>English & Faith</h2>
      <input type="password" id="pin-input" class="pin-input" maxlength="4" placeholder="••••" />
      <button class="btn-unlock" onclick="verifyPin()">Entrar</button>
    </div>
  </div>

  <header><h1>English & Faith</h1></header>

  <nav id="tabs-nav" style="display: none;">
    <button class="tab-btn active" onclick="openTab('oracao', event)">Oração</button>
    <button class="tab-btn" onclick="openTab('versiculo', event)">Verso</button>
    <button class="tab-btn" onclick="openTab('musica', event)">Som</button>
    <button class="tab-btn" onclick="openTab('chosen', event)">Chosen</button>
    <button class="tab-btn" onclick="openTab('esposa', event)">Esposa</button>
    <button class="tab-btn" onclick="openTab('noite', event)">Noite</button>
    <button class="tab-btn anki-tab" onclick="openTab('palavras', event)">🗒 Palav.</button>
    <button class="tab-btn anki-tab" onclick="openTab('anki', event)">📓 Rev.</button>
  </nav>

  <main>
    <div id="loading">Carregando conteúdo...</div>
    <div id="content-area" style="display: none;">
      <div id="tab-oracao" class="tab-content active"><div class="meta-title">Oração</div><div class="english-text" id="oracao-en"></div><div class="translation" id="oracao-pt"></div><div class="tip-box" id="oracao-tip"></div><button class="btn-action btn-audio" onclick="speakText('oracao-en')">🔊 Ouvir</button></div>
      <div id="tab-versiculo" class="tab-content"><div class="meta-title" id="versiculo-ref">Versículo</div><div class="english-text" id="versiculo-en"></div><div class="translation" id="versiculo-pt"></div><div class="tip-box" id="versiculo-tip"></div><button class="btn-action btn-audio" onclick="speakText('versiculo-en')">🔊 Ouvir</button></div>
      <div id="tab-musica" class="tab-content"><div class="meta-title" id="musica-title">Louvor</div><div class="english-text" id="musica-en"></div><div class="translation" id="musica-pt"></div><div class="tip-box" id="musica-tip"></div><button class="btn-action btn-audio" onclick="speakText('musica-en')">🔊 Ouvir</button><a id="btn-spotify-link" href="#" target="_blank" class="btn-action btn-spotify">🎧 Spotify</a></div>
      <div id="tab-chosen" class="tab-content"><div class="meta-title">The Chosen</div><div class="english-text" id="chosen-en"></div><div class="translation" id="chosen-pt"></div><div class="tip-box" id="chosen-tip"></div><button class="btn-action btn-audio" onclick="speakText('chosen-en')">🔊 Ouvir</button></div>
      <div id="tab-esposa" class="tab-content"><div class="meta-title">Para a Esposa</div><div class="english-text" id="esposa-en"></div><div class="translation" id="esposa-pt"></div><div class="tip-box" id="esposa-tip"></div><button class="btn-action btn-audio" onclick="speakText('esposa-en')">🔊 Ouvir</button></div>
      <div id="tab-noite" class="tab-content"><div class="meta-title">Segurança para a Noite</div><div class="english-text" id="noite-en"></div><div class="translation" id="noite-pt"></div><div class="tip-box" id="noite-tip"></div><button class="btn-action btn-audio" onclick="speakText('noite-en')">🔊 Ouvir</button>
        <button class="btn-action" style="background-color: #27ae60; margin-top: 20px;" onclick="finishDay()">✅ Finalizar <span id="dia-numero"></span></button>
      </div>
      <div id="tab-palavras" class="tab-content"><div id="words-list"></div></div>
      <div id="tab-anki" class="tab-content"><div id="anki-card-area"><div class="flashcard" onclick="flipAnkiCard()"><div class="english-text" id="anki-card-en"></div><div id="anki-card-back" style="display:none;"><div class="translation" id="anki-card-pt"></div><div class="tip-box" id="anki-card-tip"></div></div></div><div class="anki-controls"><button class="btn-action" onclick="answerAnki('HARD')">Difícil</button><button class="btn-action" onclick="answerAnki('GOOD')">Bom</button><button class="btn-action" onclick="answerAnki('EASY')">Fácil</button></div></div></div>
    </div>
  </main>

  <script>
    const API_URL = "SUA_URL_DO_WEB_APP_AQUI";
    const CORRECT_PIN = "1304";

    function verifyPin() {
      if (document.getElementById("pin-input").value === CORRECT_PIN) {
        document.getElementById("lock-screen").style.display = "none";
        fetchDailyContent();
      } else alert("PIN incorreto");
    }

    async function fetchDailyContent() {
      const response = await fetch(API_URL);
      const res = await response.json();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tabs-nav').style.display = 'grid';
      document.getElementById('content-area').style.display = 'block';
      document.getElementById('dia-numero').innerText = "(Dia " + res.diaAtual + ")";
      renderData(res.data);
    }

    function renderData(d) {
      document.getElementById('oracao-en').innerText = d.oracao.en;
      document.getElementById('oracao-pt').innerText = d.oracao.pt;
      document.getElementById('oracao-tip').innerText = d.oracao.tip;
      // Repetir lógica para outros campos... (versiculo, musica, etc)
    }

    async function finishDay() {
      await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'FINISH_DAY' }) });
      location.reload();
    }

    function openTab(id, e) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
      e.currentTarget.classList.add('active');
    }

    function speakText(id) {
      const text = document.getElementById(id).innerText;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      window.speechSynthesis.speak(u);
    }
  </script>
</body>
</html>
